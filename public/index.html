<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOLTERAX — Private Admin Portal</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,5 95,25 95,75 50,95 5,75 5,25' fill='%2306070B' stroke='%2300E5FF' stroke-width='6'/><path d='M45,25 L65,48 L50,50 L58,75 L35,52 L50,50 Z' fill='%2300E5FF'/></svg>">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="brand-header">
        <div class="brand-icon">⚡</div>
        <div class="brand-text">
          <h1>VOLTERAX</h1>
          <p>AUTHORIZED ADMIN ACCESS ONLY</p>
        </div>
      </div>

      <div id="alert-box" style="display: none; padding: 12px; border-radius: 8px; margin-bottom: 18px; font-size: 12px; background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.35); color: #F87171;"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Admin Email Address</label>
          <input type="email" id="email" class="input" placeholder="admin@volterax.in" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Security Password</label>
          <input type="password" id="password" class="input" placeholder="••••••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="submit-btn" class="btn cyan" style="width: 100%; margin-top: 10px; padding: 12px;">
          <span>VERIFY & SIGN IN</span> ↗
        </button>
      </form>

      <div class="security-notice">
        <strong>🛡️ PRIVATE SYSTEM</strong><br>
        Public registration is disabled. Only pre-authorized administrators authorized by the system owner may access this console. All sessions and actions are cryptographically logged.
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('alert-box');
    const submitBtn = document.getElementById('submit-btn');

    // Auto-check if already signed in
    fetch('/api/auth/me')
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        if (data && data.admin) {
          window.location.href = '/dashboard';
        }
      })
      .catch(() => {});

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>AUTHENTICATING...</span>';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Authentication failed');
        }

        window.location.href = '/dashboard';
      } catch (err) {
        alertBox.textContent = err.message;
        alertBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>VERIFY & SIGN IN</span> ↗';
      }
    });
  </script>
</body>
</html>
